<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <meta charset="utf-8">
  <style>
    .error-msg { background:#ffe6e6; color:#900; padding:10px; border:1px solid #f2a; margin-bottom:12px; }
  </style>
</head>
<body>

<h1>Sign In</h1>

<form id="loginForm" action="/login" method="post">
  <div>
    <label>Username:</label>
    <input type="email" name="username" required>
  </div>

  <div>
    <label>Password:</label>
    <input type="password" name="password" required>
  </div>

  <button type="submit">Login</button>
</form>

<script>
  const params = new URLSearchParams(window.location.search);
  if (params.has("error")) {
    const msg = params.get("error") || "Wrong username or password.";
    const err = document.createElement("div");
    err.className = "error-msg";
    err.textContent = decodeURIComponent(msg);
    const form = document.getElementById("loginForm");
    form.parentNode.insertBefore(err, form);
  }
</script>

</body>
</html>
